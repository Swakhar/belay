AllCops:
  TargetRubyVersion: 3.2
  NewCops: enable
  SuggestExtensions: false
  Exclude:
    - "gemfiles/**/*"
    - "vendor/**/*"
    - "config/**/*"
    - "log/**/*"
    - "tmp/**/*"
    - "spec/dummy/**/*"

Style/StringLiterals:
  EnforcedStyle: double_quotes

Style/Documentation:
  Enabled: false

Layout/LineLength:
  Max: 120
